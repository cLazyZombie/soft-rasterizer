name: Deploy chapter gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          # Every historical chapter commit must be available to git archive.
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
          cache: true
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Set up Rust and Wasm tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Check assets and build scripts
        run: |
          pnpm run check:assets
          pnpm run test:build-scripts
      - name: Build all production and test chapters
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify every chapter and production launcher
        run: pnpm run e2e:chapters:run
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
