[workspace]
members = ["renderer-core", "renderer-wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
renderer-core = { path = "renderer-core" }
wasm-bindgen = "0.2.127"
